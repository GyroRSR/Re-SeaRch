<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1410">
<title>Re: SeaRch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ff7a2f%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Re: SeaRch">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="RSR出演歴・缶バッジ検索ツール">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="sun"></span><span class="names"><span class="app-name">Re: SeaRch</span><span class="app-sub">RSR出演歴・缶バッジ検索ツール</span></span></div>
  <div class="stat" id="stat">読み込み中…</div>
</header>

<main>
  <!-- アーティスト -->
  <section class="view" id="v-artist">
    <div class="searchbar">
      <input id="q" type="search" placeholder="アーティスト名（ひらがな・ローマ字OK）" autocomplete="off" enterkeyhint="search">
    </div>
    <div id="suggest" class="suggest"></div>
    <div id="artist-result"></div>
  </section>

  <!-- 年 -->
  <section class="view" id="v-year" hidden>
    <div class="years" id="years"></div>
    <div id="year-result"></div>
  </section>

  <!-- 撮って探す -->
  <section class="view" id="v-camera" hidden>
    <div id="cam-start" class="cam-start">
      <p class="lead">缶バッジを撮影すると、似ている缶バッジを探します。</p>
      <label class="btn primary big">
        <input type="file" accept="image/*" capture="environment" id="file-cam" hidden>
        📷 カメラで撮る
      </label>
      <label class="btn big">
        <input type="file" accept="image/*" id="file-pick" hidden>
        🖼 写真から選ぶ
      </label>
      <p class="hint">バッジ全体（縁まで）が写るように、真上から大きめに撮ると見つかりやすくなります。</p>
      <p class="hint pc-only center">PCでは画像をこの画面にドラッグ＆ドロップ、またはCtrl+Vで貼り付けても探せます。</p>
    </div>

    <div id="cam-adjust" hidden>
      <p class="hint center">赤い円をバッジの縁に合わせてください（円の内側をドラッグで移動・2本指で拡大縮小。円の外側はスクロールできます）</p>
      <div class="stage" id="stage">
        <canvas id="stage-canvas"></canvas>
        <div class="ring" id="ring"></div>
      </div>
      <div class="row">
        <span class="small">円の大きさ</span>
        <input type="range" id="ring-size" min="5" max="100" step="0.5">
      </div>
      <div class="row">
        <span class="small">年で絞り込む</span>
        <select id="img-year"><option value="">すべての年</option></select>
      </div>
      <div class="row gap">
        <button class="btn" id="cam-retry">撮り直す</button>
        <button class="btn primary grow" id="cam-search">この範囲で探す</button>
      </div>
    </div>

    <div id="cam-result"></div>
  </section>
</main>

<nav class="tabs">
  <button data-view="artist" class="on"><span>🔍</span>アーティスト</button>
  <button data-view="year"><span>📅</span>年で見る</button>
  <button data-view="camera"><span>📷</span>撮って探す</button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <button class="close" id="modal-close" aria-label="閉じる">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  var VER = '5d4e3696088e';
  function note(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg; t.hidden = false;
    setTimeout(function () { t.hidden = true; }, 3500);
  }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function () {
      return navigator.serviceWorker.ready;
    }).then(function () {
      var done = false;
      try { done = localStorage.getItem('rs-offline') === VER; localStorage.setItem('rs-offline', VER); } catch (e) {}
      if (!done) note('オフラインで使えるようになりました');
    }).catch(function () {});
  });
})();
</script>
<script src="features.js"></script>
<script src="app.js"></script>
</body>
</html>
